# Automated releases.
#
# HOW A RELEASE HAPPENS:
#   1. PRs merge to main with conventional-commit messages (feat:/fix:/...). No manual bumps.
#   2. release-please maintains a rolling release PR that accumulates them, bumping version.txt
#      and CHANGELOG.md.
#   3. Merging that release PR creates a DRAFT release (no tag yet — GitHub creates tag v<version>
#      only at publish). build-tarball checks out the release's target sha, builds the ad-hoc-signed
#      universal app, uploads Spitter-<version>.tar.gz, then publishes — which creates tag v<version>.
# NEVER create v* tags or releases by hand — CI owns them.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual retry lever: re-run release-please without a dummy commit

permissions:
  contents: write        # tags + releases
  pull-requests: write   # release-please's release PR

concurrency:
  group: release
  cancel-in-progress: false   # queue racing merges; never abort a half-published release

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          swift --version
          command -v shellcheck >/dev/null || brew install shellcheck
      - name: Check (build + tests + lint)
        run: make check

  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Root-package outputs are unprefixed, unlike the path-scoped `pkg--` form a monorepo emits.
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      # build-tarball checks out this sha, not tag_name: the tag does not exist while draft.
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp

  build-tarball:
    needs: [check, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Build universal app bundle
        run: ./build.sh

      - name: Create tarball (install.sh consumes it — curl/tar carries no quarantine xattr)
        run: tar -czf "Spitter-${{ needs.release-please.outputs.version }}.tar.gz" -C build Spitter.app

      - name: Upload artifact and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            "Spitter-${{ needs.release-please.outputs.version }}.tar.gz"
          gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false
